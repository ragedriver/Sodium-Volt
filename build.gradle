plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

repositories {
	maven {
		name = "CaffeineMC"
		url = "https://maven.caffeinemc.net/releases"
	}
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"sodium-volt" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// Sodium is required by Sodium Volt and is loaded in the development client.
	implementation "net.caffeinemc:sodium-fabric:${project.sodium_version}"
}

dependencyLocking {
	lockAllConfigurations()
	lockMode = LockMode.STRICT
}

// Fabric Loader ignores SemVer build metadata in dependency comparisons. The
// separate Minecraft dependency constrains the compatible game version.
def fabricApiMinimumVersion = project.fabric_api_version.split('\\+', 2)[0]
def expectedModVersion = project.version.toString()
def expectedFabricApiPredicate = ">=${fabricApiMinimumVersion}".toString()

processResources {
	inputs.property "version", expectedModVersion
	inputs.property "fabricApiMinimumVersion", fabricApiMinimumVersion

	filesMatching("fabric.mod.json") {
		expand "version": expectedModVersion, "fabricApiMinimumVersion": fabricApiMinimumVersion
	}
}

def processedFabricMod = layout.buildDirectory.file("resources/main/fabric.mod.json")

tasks.register("verifyFabricModMetadata") {
	group = "verification"
	description = "Verifies generated Fabric dependency metadata."
	dependsOn tasks.processResources
	inputs.file processedFabricMod
	inputs.property "expectedModVersion", expectedModVersion
	inputs.property "expectedFabricApiPredicate", expectedFabricApiPredicate

	doLast {
		def metadata = new groovy.json.JsonSlurper().parse(processedFabricMod.get().asFile)

		if (metadata.version != expectedModVersion) {
			throw new GradleException("fabric.mod.json version '${metadata.version}' does not match '${expectedModVersion}'")
		}
		if (metadata.depends?.get("fabric-api") != expectedFabricApiPredicate) {
			throw new GradleException("fabric.mod.json fabric-api dependency '${metadata.depends?.get("fabric-api")}' does not match '${expectedFabricApiPredicate}'")
		}
	}
}

tasks.check.dependsOn tasks.verifyFabricModMetadata

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

sourceSets.test.compileClasspath += sourceSets.client.output
sourceSets.test.runtimeClasspath += sourceSets.client.output

tasks.register("voltGuardUnitTest", JavaExec) {
	group = "verification"
	description = "Runs Sodium Volt's dependency-free runtime logic tests."
	dependsOn tasks.testClasses
	classpath = sourceSets.test.runtimeClasspath
