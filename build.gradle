tasks.check.dependsOn tasks.voltGuardUnitTest
tasks.check.dependsOn tasks.voltInspectorUnitTest
tasks.check.dependsOn tasks.voltPerformanceUnitTest
tasks.check.dependsOn tasks.vapsUnitTest
tasks.check.dependsOn tasks.blockEntityBudgetUnitTest
